plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// Version numbers come from git rather than being edited by hand. Android refuses to install
// an APK over one with an equal or lower versionCode, so a forgotten bump silently strands
// everyone who already installed the app; deriving it removes that failure mode.
def gitOutput(String... args) {
    try {
        def stdout = new ByteArrayOutputStream()
        def result = exec {
            commandLine args
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? stdout.toString().trim() : ""
    } catch (Exception ignored) {
        return ""
    }
}

def gitTag = gitOutput('git', 'describe', '--tags', '--abbrev=0')
def gitCommits = gitOutput('git', 'rev-list', '--count', 'HEAD')
def gitSha = gitOutput('git', 'rev-parse', '--short', 'HEAD')

// A v1.2.3 tag becomes 1002003, leaving room for 999 minor and patch releases.
def tagVersionCode = 0
def tagMatch = (gitTag =~ /^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?/)
if (tagMatch.find()) {
    tagVersionCode = tagMatch.group(1).toInteger() * 1000000 +
            (tagMatch.group(2) ?: '0').toInteger() * 1000 +
            (tagMatch.group(3) ?: '0').toInteger()
}
def commitVersionCode = gitCommits ? gitCommits.toInteger() : 0

// Whichever is larger, so an untagged build can never outrank a tagged one or vice versa.
def computedVersionCode = Math.max(Math.max(tagVersionCode, commitVersionCode), 1)
def computedVersionName = gitTag ? gitTag.replaceFirst(/^v/, '') : ("0.0.0-" + (gitSha ?: "dev"))

// Signing material comes from a gitignored keystore.properties locally, or from environment
// variables in CI. When neither is present the release build is simply left unsigned rather
// than failing, so anyone can still clone and build the project.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingStoreFile = keystoreProperties['storeFile'] ?: System.getenv('KEYSTORE_FILE')
def signingStorePassword = keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
def signingKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS')
def signingKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
def canSignRelease = signingStoreFile && signingStorePassword && signingKeyAlias &&
        signingKeyPassword && file(signingStoreFile).exists()

android {
    namespace "com.lemon.prayeralarm"
    compileSdk 34

    defaultConfig {
        applicationId "com.lemon.prayeralarm"
        minSdk 26
        targetSdk 34
        versionCode computedVersionCode
        versionName computedVersionName
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}
