plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// Signing material comes from a gitignored keystore.properties locally, or from environment
// variables in CI. When neither is present the release build is simply left unsigned rather
// than failing, so anyone can still clone and build the project.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingStoreFile = keystoreProperties['storeFile'] ?: System.getenv('KEYSTORE_FILE')
def signingStorePassword = keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
def signingKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS')
def signingKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
def canSignRelease = signingStoreFile && signingStorePassword && signingKeyAlias &&
        signingKeyPassword && file(signingStoreFile).exists()

android {
    namespace "com.lemon.prayeralarm"
    compileSdk 34

    defaultConfig {
        applicationId "com.lemon.prayeralarm"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}
